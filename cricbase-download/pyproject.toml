[project]
name = "cricbase"
version = "0.1.0"
description = "Historical Test and ODI scorecard database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-espncricinfo",
    "requests",
    "beautifulsoup4",
    "dateparser",
    "lxml",
]

[project.optional-dependencies]
dev = ["playwright"]

[project.scripts]
cricbase = "cricbase.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cricbase"]
