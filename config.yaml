# ───────────────────────────────────────────────────────────────────────────
# Match quality — symmetric weight based on BOTH teams' ICC rankings
#
# Performances in matches between two high-ranked teams are inherently
# higher quality than matches between two low-ranked associates, even
# beyond the individual opposition ranking weight.  This captures the
# overall quality of the contest: fielding standards, depth of bowling/
# batting lineups, pressure of the occasion, etc.
#
# The weight is computed from the average ICC rating of both teams:
#
#   avg_rating = (team_a_rating + team_b_rating) / 2
#   normalised = avg_rating / max_rating               (0 to 1)
#   match_quality = floor + (ceiling - floor) * normalised ^ curve
#
# This is multiplied into the per-innings weight alongside opposition
# quality, team quality, ICC ranking, and recency.
#
# Examples with floor=0.60, ceiling=1.21, max_rating=272, curve=1.4:
#   India (272) vs Australia (258)  → avg 265 → ~1.20  (elite match)
#   India (272) vs Romania (45)     → avg 158 → ~0.94
#   Austria (71) vs Cyprus (33)     → avg 52  → ~0.66  (associate slugfest)
#
# Combined with icc_ranking_weight (opposition team), full-member vs England
# is worth several times more than the same batter vs Romania or two associates.
# ───────────────────────────────────────────────────────────────────────────
match_quality:
  enabled: true
  floor: 0.60 # Minimum weight (two very low-ranked teams)
  ceiling: 1.21 # Maximum weight (two top-ranked teams)
  curve: 1.4 # Exponent on normalised average rating (>1 = super-linear)
  # NOTE: match_quality uses the ratings table from icc_ranking.ratings above.
  # No separate ratings table needed here.

# ───────────────────────────────────────────────────────────────────────────
# Recency / time-decay weighting
#
# More recent performances count for more in career aggregation.
#
# weight = 2 ^ (-(days_since_innings / half_life_days))
#
# Examples with half_life_days=545 (~1.5 years):
#   Today         → weight 1.00
#   6 months ago  → weight 0.79
#   1 year ago    → weight 0.63
#   1.5 years ago → weight 0.50
#   3 years ago   → weight 0.25
#   5 years ago   → weight 0.10
#
# The recency weight is multiplied with opposition/team quality weights
# to form the final per-innings weight used in career aggregation.
#
# Set enabled=false to disable time-decay entirely.
# ───────────────────────────────────────────────────────────────────────────
recency:
  enabled: true
  half_life_days: 545 # ~1.5 years — stronger recency bias to penalise inactive players
  min_weight: 0.03 # Floor: very old innings still count but less than before

# ───────────────────────────────────────────────────────────────────────────
# Phase dot-ball penalty weights (batting Control component)
#
# Dots in the powerplay hurt more (wasting the field restriction);
# dots at the death hurt less (power hitting matters more there).
# ───────────────────────────────────────────────────────────────────────────
batting_dot_penalty_phase_weights:
  powerplay: 0.7 # dots in PP more acceptable (fielders in circle, harder to rotate)
  middle: 1.0
  death: 1.5 # dots at death are most punishing (need to score fastest)

# ───────────────────────────────────────────────────────────────────────────
# Player identity deduplication
#
# Curated alias table: maps secondary (duplicate) registry IDs to the
# canonical ID.  Built by cross-referencing team, stats, and known
# Cricsheet data issues.
#
# Format:
#   secondary_id: canonical_id
#
# The merge is applied early in the pipeline so all downstream code sees
# only canonical IDs.
# ───────────────────────────────────────────────────────────────────────────
# ───────────────────────────────────────────────────────────────────────────
# Batting — Position-group comparisons
#
# Batters are compared to peers at similar batting positions rather than
# the entire population.  This prevents finishers (positions 6-7) who bat
# mostly at the death from having inflated acceleration scores relative to
# openers, and ensures aggressive openers are compared on control metrics
# against other openers (Kohli, Babar) rather than tailenders.
#
# Groups (with ±1 position flex based on modal batting position):
#   top_order    : positions 1-3   (openers + one-down)
#   upper_middle : positions 4-5   (middle order anchors)
#   lower_middle : positions 6-7   (finishers / wicket-keepers)
#   lower_order  : positions 8-9   (bowling all-rounders)
#   tail         : positions 10-11 (tailenders)
#
# Z-scores for batting sub-components are computed WITHIN each group,
# then percentile-ranked across the full population.  This means:
#   - Dhoni (pos 6-7) at SR 125 is compared to Russell/David at SR 150+
#     → his acceleration z-score is low within his group
#   - Kohli (pos 3) at SR 136 is compared to other top-3 batters at ~128
#     → his acceleration z-score is high within his group
#   - Allen/Head (pos 1-2) with high dot% are compared to Babar/Rizwan
#     → their control z-scores drop because peers rotate strike better
#
# min_group_size: if a position group has fewer than this many qualified
# batters, it is merged with the nearest adjacent group to avoid noisy
# z-scores from tiny samples.
# ───────────────────────────────────────────────────────────────────────────
batting_position_groups:
  enabled: true
  min_group_size: 20
  # Blend weight for within-group vs population z-scores.
  # 1.0 = pure within-group (old behaviour, cross-group incomparable)
  # 0.0 = pure population (no position adjustment)
  # 0.6 = 60% within-group + 40% population (recommended)
  blend_alpha: 0.6
  # Map batting positions to group names
  groups:
    1: "top_order"
    2: "top_order"
    3: "top_order"
    4: "upper_middle"
    5: "upper_middle"
    6: "lower_middle"
    7: "lower_middle"
    8: "lower_order"
    9: "lower_order"
    10: "tail"
    11: "tail"
  # Merge order when a group is too small (merge into the next group listed)
  merge_fallback:
    tail: "lower_order"
    lower_order: "lower_middle"

# ───────────────────────────────────────────────────────────────────────────
# Bowling — Phase-group comparisons
#
# Bowlers are classified by their primary bowling phase based on where the
# plurality of their legal balls are bowled:
#   pp_heavy     : plurality of balls in powerplay (overs 1-6)
#   middle_heavy : plurality of balls in middle overs (overs 7-14)
#   death_heavy  : plurality of balls in death overs (overs 15-20)
#
# A death bowler with economy 9 where death-phase par is 10.5 is performing
# far better than a powerplay bowler with economy 9 where PP par is 7.5.
# Phase-specific par rates ensure each bowler's economy is judged against
# the par for the overs they actually bowl in.
#
# At career level, bowlers are z-scored within their phase group so a
# death specialist is compared to other death specialists, not to
# powerplay bowlers who naturally have lower economies.
#
# min_group_size: if a phase group has fewer than this many qualified
# bowlers, it falls back to population-wide z-scoring.
# ───────────────────────────────────────────────────────────────────────────
bowling_phase_groups:
  enabled: true
  min_group_size: 20
  # Blend weight for within-group vs population z-scores
  # (same rationale as batting_position_groups.blend_alpha)
  blend_alpha: 0.6

player_aliases: {}
  # Example:
  # "abc123": "def456"   # Player X duplicate entry

# Display name overrides: when merging, keep this name.
# Format:
#   canonical_id: "Preferred Display Name"
player_name_overrides: {}
  # Example:
  # "def456": "Rohit Sharma"

# ───────────────────────────────────────────────────────────────────────────
# Duplicate detection heuristics
# ───────────────────────────────────────────────────────────────────────────
duplicate_detection:
  min_innings: 5 # Both players must have at least this many innings
  export_csv: true # Write detected pairs to output/potential_duplicates.csv

# ═══════════════════════════════════════════════════════════════════════════
# Version 0.2 Feature Configuration
# ═══════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────
# Feature 1 & 2: Presentation layer (grades + archetypes)
# ───────────────────────────────────────────────────────────────────────────
presentation:
  grade_boundaries:
    S: 95
    A_plus: 85
    A: 75
    B_plus: 60
    B: 45
    C_plus: 30
    C: 15
    D: 0
  archetypes_enabled: true
  # Career production bonus (batting only) — additive bonus to overall score
  # based on total career runs.  Rewards sustained high-volume producers and
  # reduces overvaluation of low-volume situational finishers.
  #   bonus = runs_bonus_max * clip(total_runs / runs_bonus_ref, 0, 1) ^ runs_bonus_curve
  runs_bonus_max: 2.0 # Maximum additive bonus (points on the 0-100 scale)
  runs_bonus_ref: 3000.0 # Total runs at which the full bonus is realised
  runs_bonus_curve: 0.8 # Sub-linear curve (< 1) so partial credit at lower totals
  # Batting dimension weights for overall score.  Control gets the highest
  # weight because not getting out is the single most important skill in T20
  # cricket — every ball survived is a ball available to score.  This ensures
  # that a player averaging 40 with SR 133 (Kohli in IPL) outranks a player
  # averaging 30 with SR 132 (Rohit in IPL) despite a Power score gap.
  # Weights are normalised internally so they don't need to sum exactly to 1.0.
  bat_weight_acceleration: 0.35
  bat_weight_power: 0.20
  bat_weight_control: 0.45
  # Career batting average bonus — additive bonus to overall score based on
  # career batting average.  Rewards elite averages that indicate sustained
  # consistency beyond what the ACC/POW/CTRL equal-weight mean captures.
  # A T20 avg of 38+ is world-class; averaging 30 is merely good.
  #   bonus = avg_bonus_max * clip(career_avg / avg_bonus_ref, 0, 1) ^ avg_bonus_curve
  # Super-linear curve (> 1) so the reward accelerates for elite averages.
  avg_bonus_max: 5.0 # Maximum additive bonus (points on the 0-100 scale)
  avg_bonus_ref: 38.0 # Career avg at which the full bonus is realised
  avg_bonus_curve: 2.5 # Super-linear curve (> 1) so elite avgs get disproportionate reward

# ───────────────────────────────────────────────────────────────────────────
# Feature 3: Clutch / Pressure Index
# ───────────────────────────────────────────────────────────────────────────
clutch:
  enabled: true
  min_pressure_innings: 5
  high_rrr_threshold: 9.0 # required run rate threshold for 2nd innings
  collapse_wickets: 3 # wickets in PP to qualify as "collapse"

# ───────────────────────────────────────────────────────────────────────────
# Feature 6: Chase Master Index
# ───────────────────────────────────────────────────────────────────────────
chase_master:
  enabled: true
  min_innings_per_type: 5 # minimum setting or chasing innings

# ───────────────────────────────────────────────────────────────────────────
# Feature 7: Player Similarity Engine
# ───────────────────────────────────────────────────────────────────────────
similarity:
  enabled: true
  top_k: 3
  min_innings: 15

# ───────────────────────────────────────────────────────────────────────────
# Feature 8: Selfless vs Stat-Padder Index
# ───────────────────────────────────────────────────────────────────────────
selfless:
  enabled: true
  fifty_approach_range: [40, 49]
  century_approach_range: [90, 99]
  min_zone_balls: 3

# ───────────────────────────────────────────────────────────────────────────
# Feature 9: Venue & Pitch Difficulty Adjustment
# ───────────────────────────────────────────────────────────────────────────
venue:
  enabled: true
  min_matches: 5

# ───────────────────────────────────────────────────────────────────────────
# Feature 4: Head-to-Head / Matchup Analysis
# ───────────────────────────────────────────────────────────────────────────
matchups:
  min_balls: 6 # min batter-balls in a matchup to qualify
  min_balls_phase: 4 # min batter-balls per phase matchup
  top_k_bunnies: 5 # top-K nemeses / bunnies per player
  top_k_dominant: 5 # top-K dominant matchups per player

# ───────────────────────────────────────────────────────────────────────────
# Feature 10: Win Probability Added (WPA)
# ───────────────────────────────────────────────────────────────────────────
wpa:
  enabled: false # disabled by default (expensive)
  score_ratio_buckets: 10 # buckets for 2nd-innings score/target ratio
  rr_ratio_buckets: 8 # buckets for 1st-innings run-rate ratio

# ───────────────────────────────────────────────────────────────────────────
# Feature 11: Anchor Cost / Balls-to-Par
# ───────────────────────────────────────────────────────────────────────────
anchor_cost:
  enabled: true

# ───────────────────────────────────────────────────────────────────────────
# Feature 13: Form Tracker (Time-Series Rolling Averages)
# ───────────────────────────────────────────────────────────────────────────
form_tracker:
  enabled: true
  window_matches_bat: 10
  window_matches_bowl: 10
  min_window: 5

# ───────────────────────────────────────────────────────────────────────────
# Feature 14: Positional WAR (Wins Above Replacement)
# ───────────────────────────────────────────────────────────────────────────
war:
  enabled: true
  replacement_percentile: 0.25

# ───────────────────────────────────────────────────────────────────────────
# Feature 15: Era-Adjusted Ratings
# ───────────────────────────────────────────────────────────────────────────
era_adjustment:
  enabled: false # disabled by default (experimental)
  rolling_years: 3

# ───────────────────────────────────────────────────────────────────────────
# Feature 16: Bowl First / Bowl Second Index (bowling innings splits)
# ───────────────────────────────────────────────────────────────────────────
bowl_splits:
  enabled: true
  min_spells_per_type: 5 # min spells in each innings type for split index

# ───────────────────────────────────────────────────────────────────────────
# Feature 17: Condition-Dependence Metrics (flat-track bully detection)
# ───────────────────────────────────────────────────────────────────────────
condition_dependence:
  enabled: true
  min_bat_innings: 10 # min innings for batting CDI
  min_bowl_spells: 10 # min spells for bowling CDI
  par_sr_col: match_par_sr # match context column for scoring environment
  bat_performance_col: acc_overall_sr # batting performance metric
  bowl_performance_col: acc_economy_vs_par # bowling performance metric

# ───────────────────────────────────────────────────────────────────────────
# Feature 18: Bayesian Matchup Shrinkage (archetype-based priors)
# ───────────────────────────────────────────────────────────────────────────
matchup_shrinkage:
  enabled: true
  shrinkage_balls: 30 # balls at which head-to-head data equals prior weight
