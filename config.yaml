# ═══════════════════════════════════════════════════════════════════════════
# Cricket Metrics — Central Configuration
# ═══════════════════════════════════════════════════════════════════════════
#
# All tuning constants for the player-profiling pipeline live here.
# Edit values and re-run the pipeline — no code changes needed.
#
# To use a custom config: python src/main.py --config my_config.yaml
# ═══════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────
# Pipeline thresholds
# ───────────────────────────────────────────────────────────────────────────
pipeline:
  min_bat_innings: 10 # Batting innings below this → provisional
  min_bowl_overs: 30 # Bowling overs below this → provisional
  min_phase_balls_batting: 4 # Min balls faced in a phase for stats to count
  min_phase_balls_bowling: 6 # Min balls bowled in a phase for stats to count

# Per-match JSON under output_dir/scorecards/ (GUI scorecard pages)
scorecards:
  # When true, run empirical WP scoring so each delivery includes win_prob_* / wpa (3 dp).
  # Independent of wpa.enabled (career WPA parquet outputs).
  win_probability: true

# ───────────────────────────────────────────────────────────────────────────
# Rating system (Bayesian shrinkage + confidence bonus + percentile)
# ───────────────────────────────────────────────────────────────────────────
rating:
  shrinkage_k_bat: 12.0 # Shrinkage strength for batting (higher = more pull to mean)
  shrinkage_k_bowl: 10.0 # Shrinkage strength for bowling
  confidence_alpha: 0.03 # Max confidence bonus (3%) for match volume
  confidence_reference_n: 100.0 # Sample size at which full bonus is reached

# ───────────────────────────────────────────────────────────────────────────
# Batting — Acceleration sub-component weights (must sum to 1.0)
# ───────────────────────────────────────────────────────────────────────────
batting_acceleration_weights:
  overall_sr: 0.15 # Context-adjusted overall strike rate (TSR)
  sr_growth: 0.12 # SR growth from first to second half of innings
  death_sr: 0.10 # Death-overs SR relative to death-phase par
  impact: 0.13 # Volume × speed above par (rewards big fast knocks)
  runs_above_expected: 0.25 # Phase-based xR delta: actual runs − expected runs per ball
  leveraged_rva: 0.25 # xR-based leveraged Run Value Added (primary context-adjusted signal)

# ───────────────────────────────────────────────────────────────────────────
# Batting — Power sub-component weights (must sum to 1.0)
# ───────────────────────────────────────────────────────────────────────────
batting_power_weights:
  boundary_pct: 0.12 # Boundary % of total runs (4s + 6s combined)
  six_rate: 0.15 # Sixes per ball faced — clearest signal of raw power
  boundary_rate_vs_par: 0.13 # Boundary rate relative to match average
  peak_phase_sr: 0.10 # Best phase SR relative to that phase's par
  finishing_burst: 0.15 # SR jump from first 2/3 → final 1/3 of innings (gear-shifting)
  power_impact: 0.10 # Boundary runs/ball × SR/par for 20+ ball innings (sustained power)
  cabi: 0.25 # Context-Adjusted Boundary Index (primary boundary power signal)

# ───────────────────────────────────────────────────────────────────────────
# Batting — Control sub-component weights (must sum to 1.0)
# ───────────────────────────────────────────────────────────────────────────
batting_control_weights:
  dot_pct_weighted: 0.08 # Phase-weighted dot ball % (inverted; death dots 1.5×, PP 0.7×) — reduced: dots less valuable than scoring
  rotation: 0.08 # Rotation rate (1s + 2s per ball)
  contribution: 0.10 # Team contribution %
  avg_proxy: 0.22 # Career average (z-scored) — increased: batting average matters more
  dismissal_quality: 0.10 # Dismissal context quality (inverted)
  scoring_consistency: 0.14 # Raw 1 − dot% (unweighted); pure bat-on-ball control index — increased: consistency matters
  survival_ratio: 0.28 # Expected Survival Rate from hazard model (primary control signal) — slight reduction to balance

# ───────────────────────────────────────────────────────────────────────────
# Batting — Average quality gate (post-percentile)
#
# Two-stage system to penalise low-average sloggers:
#
# Stage 1 (pre-percentile, on raw z-score composites):
#   Asymmetric factor around the population median:
#     Below reference: steep penalty (exponent_below)
#     Above reference: gentle bonus (exponent_above, capped)
#
# Stage 2 (post-percentile, on final 0-100 scores):
#   gate = base + (1 - base) * clip(avg / ref, 0, 1)
#
# Combined effect examples (approximate):
#   avg 10 → ACC/POW scores ~55-60% of ungated
#   avg 15 → ~80-83%
#   avg 25 → 100% (no penalty)
# ───────────────────────────────────────────────────────────────────────────
batting_avg_quality:
  # Stage 1 — pre-percentile multiplicative factor
  reference: 18.0 # Population median T20 average
  exponent_below: 2.5 # Steep penalty below reference
  exponent_above: 0.65 # Moderate bonus above reference (raised from 0.5 for better elite-avg differentiation)
  floor: 0.40 # Minimum factor (worst case)
  ceil: 1.35 # Maximum factor (raised from 1.20 so avg-40 and avg-30 batters aren't both capped)

  # Stage 2 — post-percentile gate for ACC / POW
  gate_base: 0.55 # Floor: even worst avg can't go below 55%
  gate_ref: 25.0 # Average at which gate = 1.0

  # Stage 2 — post-percentile gate for Control (milder)
  ctrl_gate_base: 0.70 # Floor for Control gate
  ctrl_gate_ref: 22.0 # Average at which Control gate = 1.0

# ───────────────────────────────────────────────────────────────────────────
# Batting — Volume scaling (post-percentile)
#
# factor = base + (1 - base) * clip(innings / ref, 0, 1) ^ curve
# Players exceeding ref get a beyond-reference bonus:
#   beyond_bonus = beyond_max * clip((innings - ref) / ref, 0, 1)
#
# Examples with defaults (base=0.70, ref=100, curve=0.5, beyond_max=0.06):
#   10 innings → factor ~0.79   (21% penalty)
#   19 innings → factor ~0.83   (17% penalty)
#   30 innings → factor ~0.86   (14% penalty)
#   50 innings → factor ~0.91   ( 9% penalty)
#   75 innings → factor ~0.96   ( 4% penalty)
#   100 innings → factor 1.00   (no penalty)
#   120 innings → factor 1.01   ( 1% bonus)
#   150 innings → factor 1.03   ( 3% bonus)
#   200+ innings → factor 1.06  ( 6% bonus, max)
# ───────────────────────────────────────────────────────────────────────────
batting_volume:
  base: 0.70 # Floor factor for lowest-volume players
  ref: 100.0 # Innings at which factor = 1.0
  curve: 0.5 # Exponent (higher = steeper curve near ref)
  beyond_max: 0.06 # Max bonus for players exceeding ref (e.g. 6% at 2× ref)

# ───────────────────────────────────────────────────────────────────────────
# Competition quality gate (post-percentile)
#
# Directly scales down final 0-100 scores for players who primarily face
# weak opposition.  This is separate from (and complementary to) the
# per-innings ICC ranking weight which affects career aggregation weights.
#
# The gate uses the player's average opponent ICC rating across their career:
#
#   normalised = avg_opp_icc_rating / max_rating          (0 to 1)
#   gate = base + (1 - base) * normalised ^ curve
#
# A sub-linear curve (< 1) concentrates the penalty on players with very
# low average opponent quality while barely affecting players who face
# top-ranked teams.
#
# Examples with defaults (base=0.55, curve=0.5, max_rating=272):
#   avg_opp 260 (faces top-8 teams)   → normalised 0.96 → gate 0.99
#   avg_opp 230 (faces Test nations)   → normalised 0.85 → gate 0.96
#   avg_opp 200 (mixed opponents)      → normalised 0.74 → gate 0.94
#   avg_opp 150 (mid-tier associates)  → normalised 0.55 → gate 0.88
#   avg_opp 120 (low-tier associates)  → normalised 0.44 → gate 0.85
#   avg_opp  80 (very weak opponents)  → normalised 0.29 → gate 0.79
#   avg_opp  30 (unranked opponents)   → normalised 0.11 → gate 0.70
#
# Combined with all other weights, a Hong Kong batter averaging opponents
# with ICC rating ~120 would have their final scores scaled to ~85% of
# their raw percentile, while an India batter facing average opponents
# with ICC rating ~235 keeps ~97% of their scores.
# ───────────────────────────────────────────────────────────────────────────
competition_quality_gate:
  enabled: true
  base: 0.55 # Floor: worst-case player facing only unranked teams keeps 55% + small normalised contribution
  curve: 0.5 # Sub-linear: gentle for high opposition, steep penalty for low opposition

# ───────────────────────────────────────────────────────────────────────────
# Bowling — Accuracy sub-component weights (must sum to 1.0)
# ───────────────────────────────────────────────────────────────────────────
bowling_accuracy_weights:
  economy_vs_par: 0.20 # Context-adjusted economy
  dot_pct: 0.20 # Dot ball percentage
  extras_penalty: 0.15 # Wides + no-balls per over (negated)
  boundary_penalty: 0.15 # Boundary % conceded (negated)
  run_yield_variance: 0.30 # Run-yield variance (inverted) — tight clustering = accuracy

# ───────────────────────────────────────────────────────────────────────────
# Bowling — Control sub-component weights (must sum to 1.0)
#
# Phase-weighted economy vs par is the dominant signal: each phase of a
# bowler's spell is judged against that phase's par run rate, so a death
# bowler with economy 9 vs death par 10.5 is correctly valued as elite.
#
# economy vs other bowlers in the same innings remains important but at
# reduced weight (0.25 → from 0.35) because it structurally penalises
# death specialists whose economy is naturally higher than PP/middle
# bowlers in the same match.  This rebalance lifts death bowlers like
# Arshdeep Singh to fairer Control scores while still rewarding bowlers
# like Bumrah who outperform teammates.
#
# extras_pct reduced from 0.10 to 0.05 to avoid double-counting with
# the extras component.  phase_consistency boosted to 0.15 to reward
# bowlers who maintain control across all phases.
# ───────────────────────────────────────────────────────────────────────────
bowling_control_weights:
  economy_vs_par: 0.15 # Context-adjusted economy (phase-weighted: fairest signal for death bowlers)
  vs_others: 0.22 # Economy vs other bowlers — important but reduced to avoid unfairly penalising death specialists
  entropy: 0.10 # Run distribution entropy (inverted)
  phase_consistency: 0.10 # Low variance in economy across phases
  extras: 0.08 # Wides + no-balls per over (negated)
  extras_pct: 0.05 # Bowler-responsible extras as % of runs (reduced — overlaps with extras)
  bowling_rv: 0.30 # Adjusted Bowling Leveraged Run Value from xR (primary control signal)

# ───────────────────────────────────────────────────────────────────────────
# Bowling — Threat sub-component weights (must sum to 1.0)
# ───────────────────────────────────────────────────────────────────────────
bowling_threat_weights:
  wickets: 0.10 # Raw wickets per spell
  quality_wickets: 0.10 # Position-weighted wickets (top-order > tail)
  sr: 0.10 # Bowling strike rate (inverted)
  bowled_lbw: 0.10 # Bowled/LBW % of wickets (pure skill)
  pressure: 0.15 # Economy vs others (pressure differential)
  dots: 0.15 # Dot ball % (sustained pressure)
  wha: 0.30 # Wicket Hazard Added — wickets above baseline probability (primary threat signal)

# ───────────────────────────────────────────────────────────────────────────
# Bowling — Volume scaling (post-percentile)
#
# factor = base + (1 - base) * clip(matches / ref, 0, 1) ^ curve
# Players exceeding ref get a beyond-reference bonus:
#   beyond_bonus = beyond_max * clip((matches - ref) / ref, 0, 1)
#
# Examples with defaults (base=0.70, ref=100, curve=0.5, beyond_max=0.06):
#   10 matches → factor ~0.79   (21% penalty)
#   19 matches → factor ~0.83   (17% penalty)
#   30 matches → factor ~0.86   (14% penalty)
#   50 matches → factor ~0.91   ( 9% penalty)
#   75 matches → factor ~0.96   ( 4% penalty)
#   100 matches → factor 1.00   (no penalty)
#   120 matches → factor 1.01   ( 1% bonus)
#   150 matches → factor 1.03   ( 3% bonus)
#   200+ matches → factor 1.06  ( 6% bonus, max)
# ───────────────────────────────────────────────────────────────────────────
bowling_volume:
  base: 0.70
  ref: 100.0
  curve: 0.5
  beyond_max: 0.06

# ───────────────────────────────────────────────────────────────────────────
# Wicket quality — position-based weighting for bowling Threat
#
# Top-order (1-3) are most valuable, tail (9-11) are least.
# A tailender wicket at 0.3 means it's worth ~20% of an opener wicket.
# ───────────────────────────────────────────────────────────────────────────
wicket_quality:
  position_weights:
    1: 1.5 # Opener
    2: 1.5 # Opener
    3: 1.4 # One-down
    4: 1.2 # Middle order
    5: 1.1
    6: 1.0
    7: 0.8
    8: 0.7 # Lower order
    9: 0.5 # Tail
    10: 0.4
    11: 0.3
  default_weight: 0.8 # Unknown batting position

# ───────────────────────────────────────────────────────────────────────────
# Opposition quality — weight innings by bowling attack strength
#
# Per-innings weight = 1 + clip(opp_quality * scale, -clip, clip)
# With scale=0.15: a +2 SD attack → weight 1.30, a −2 SD → weight 0.70
# ───────────────────────────────────────────────────────────────────────────
opposition_quality:
  scale: 0.15
  clip: 0.3

# ───────────────────────────────────────────────────────────────────────────
# Team quality — iterative PageRank-style quality index
#
# Per-innings weight = 1 + clip(team_quality * scale, -clip, clip)
# Combined with opposition quality for the final innings weight.
# ───────────────────────────────────────────────────────────────────────────
team_quality:
  # Team quality is now derived from ICC rankings (icc_ranking.ratings below).
  # The old PageRank-style iterative win-rate computation has been removed.
  scale: 0.10 # Weight scale factor (z-score → innings weight multiplier)
  clip: 0.25 # Max deviation from 1.0

# ───────────────────────────────────────────────────────────────────────────
# ICC T20I ranking-based opposition weighting
#
# Performances against higher-ranked teams are worth more than performances
# against lower-ranked associates.  Uses current ICC Men's T20I Team Rankings
# (source: https://en.wikipedia.org/wiki/ICC_Men%27s_T20I_Team_Rankings).
#
# The weight for each innings is computed from the opposing team's ICC rating:
#
#   normalised = rating / max_rating           (0 to 1)
#   icc_weight = floor + (ceiling - floor) * normalised ^ curve
#
# Examples with floor=0.40, ceiling=1.40, max_rating=272, curve=2.0:
#   India (272)      → 1.40   (ceiling — elite opposition)
#   England (260)    → 1.35
#   Netherlands (181)→ 0.99
#   Romania (45)     → 0.41
#   default_rating 20→ 0.40   (floor — unknown / tiny nations)
#
# Together with match_quality (below), the combined innings multiplier for a
# full member facing England vs the same team facing Romania is ~4× (was ~3×
# under looser curves). Tune floor/ceiling/curve if you want an even steeper gap.
#
# The super-linear curve concentrates weight toward top-ranked teams so associate
# fixtures cannot dominate career aggregates.
#
# This weight is multiplied into the per-innings weight alongside
# opposition bowling quality, team quality, and recency.
# ───────────────────────────────────────────────────────────────────────────
icc_ranking:
  enabled: true
  floor: 0.40 # Minimum weight (weak / unranked opposition)
  ceiling: 1.40 # Maximum weight (top-ranked opposition)
  curve: 2.0 # Exponent on normalised rating (>1 = super-linear, widens ENG vs ROU gap)
  max_rating: 272 # Rating of the top team (used for normalisation)
  default_rating: 20 # Rating assigned to teams not in the table

  # For T20I-only UI filters (scorecards, performances): top N sides by rating
  # below count as "main"; the rest of the table are "associates". IPL ignores this.
  t20i_main_team_count: 15

  # ICC Men's T20I Team Rankings as of March 2026.
  # Keys must match Cricsheet team names exactly.
  # Update periodically from the ICC website.
  # This is the canonical ratings table — used by icc_ranking weights,
  # match_quality weights, AND team_quality (replacing the old PageRank approach).
  ratings:
    India: 272
    England: 260
    Australia: 258
