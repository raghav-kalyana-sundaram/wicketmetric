<!DOCTYPE html>
<html lang="en" data-theme="charcoal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wicket Metric</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#/">Wicket Metric</a>
    <nav class="util">
      <a href="#/stats" data-nav="stats">Stats</a>
      <a href="#/best" data-nav="best">Best</a>
      <a href="#/compare" data-nav="compare">Compare</a>
      <a href="#/build" data-nav="build">Build</a>
      <a href="#/resources" data-nav="resources">Resources</a>
      <button type="button" class="search-toggle" id="search-toggle" hidden aria-expanded="false">Search</button>
      <span class="data-date" id="data-date">Data: —</span>
      <button type="button" class="icon-btn shortcuts-btn" id="keys-toggle" aria-label="Keyboard shortcuts" aria-expanded="false" title="Keyboard shortcuts">Shortcuts</button>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to paper theme">Paper theme</button>
    </nav>
  </header>

  <div class="shell" id="query-shell">
    <div id="home-hero" hidden>
      <p class="lede">Search a knock, or open Stats.</p>
    </div>
    <div class="query-wrap hero" id="query-wrap">
      <div class="query-box">
        <div class="query-highlight" id="query-highlight" aria-hidden="true"></div>
        <input class="query-input" id="query-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="Player, or a score: kohli 89" aria-label="Search">
      </div>
      <div class="ghost" id="query-ghost" hidden></div>
      <div class="ac" id="ac" role="listbox"></div>
    </div>
    <div id="home-extras">
      <div class="fmt-row" id="fmt-row">
        <span class="fmt-label">Format</span>
        <button type="button" class="tab active" data-fmt="">All</button>
        <button type="button" class="tab" data-fmt="test">Tests</button>
        <button type="button" class="tab" data-fmt="odi">ODI</button>
        <button type="button" class="tab" data-fmt="t20i">T20I</button>
        <button type="button" class="tab" data-fmt="ipl">IPL</button>
      </div>
      <div class="try-label">Try</div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="search-scrim" id="search-scrim" hidden></div>

  <main class="shell" id="main"></main>

  <footer class="provenance">
    Cricsheet data (CC BY-SA / ODbL), built locally · Metrics in <a href="#/resources">MODEL.md</a> · In this warehouse, not an official rating.
    <a href="#/resources/attribution">ATTRIBUTION.md</a>
  </footer>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
