[project]
name = "cricwarehouse"
version = "1.1.0"
description = "Local Cricket Warehouse — Cricsheet scorecards and T20 value metrics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Local Cricket Warehouse" }]
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "pandas>=2.2",
    "orjson>=3.10",
    "httpx>=0.27",
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cricwarehouse = "cricwarehouse.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cricwarehouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
