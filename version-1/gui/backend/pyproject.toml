[project]
name = "app"
version = "0.1.0"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pandas>=2.0.0",
  "pyarrow>=15.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.0",
  "httpx>=0.27.0",
]
# Broad range so Vercel’s Python builder can use 3.12–3.14 (see .vercel/output runtime).
requires-python = ">=3.12,<3.15"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
